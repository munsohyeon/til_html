<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>나의 til</title>
  </head>
  <body>
    <!-- full layout  -->
    <div class="wrap">
      <!-- top -->
      <header class="header">
        <div class="layout">
          <!-- top of top-->
          <div class="header_top">
            <div class="header_top_left">
              <!-- logo -->
              <div class="logo">
                <a href="http://interpark.com" target="_blank">
                  <img src="images/logo.svg" alt="로고" title="인터파크" />
                </a>
              </div>
              <!-- search -->
              <div class="search">
                <!-- 제품 검색 API 연동 -->
                <form class="search_form">
                  <input type="text" placeholder="제품을 검색해 주세요" />
                  <input type="submit" value="검색" />
                </form>
              </div>
            </div>
            <div class="header_top_right">
              <ul class="member">
                <li><a href="#">로그인</a></li>
                <li><a href="#">회원가입</a></li>
              </ul>
            </div>
          </div>
          <!-- top of bottom -->
          <div class="header_bottom">
            <div class="header_bottom_nav">
              <ul class="nav">
                <li><a href="#">HOME</a></li>
                <li><a href="#">TOUR</a></li>
                <li><a href="#">TICKET</a></li>
              </ul>
            </div>
            <div class="header_bottom_eventmenu">
              <ul>
                <li>
                  <a href="#">
                    해외여행쿠폰
                    <img
                      src="images/badge_hot.svg"
                      alt="해외여행쿠폰"
                      title="해외여행쿠폰"
                  /></a>
                </li>
                <li>
                  <a href="#">
                    국내여행쿠폰
                    <img
                      src="images/badge_hot.svg"
                      alt="국내여행쿠폰"
                      title="국내여행쿠폰"
                  /></a>
                </li>
                <li><a href="#">여행혜택존</a></li>
                <li><a href="#">여행준비</a></li>
              </ul>
            </div>
          </div>
        </div>
      </header>
      <!-- main -->
      <main>
        <div class="layout">
          <!-- banner -->
          <div class="banner">
            <div class="banner_list"> <a href="#">
              <img src="images/v1.png" alt="banner" title="배너"/>
              <img src="images/v2.jpg" alt="banner" title="배너"/>
            </a>
          </div>
          </div>
        </div>
          <div class="banner_list">
            <button class="slide_bt banner_left">
              <img src="images/slider_arrow.svg" alt="left" title="left"/>
            </button>
            <button class="slide_bt banner_right">
              <img src="images/slider_arrow.svg" alt="right" title="right"/>
            </button>
          </div>
          <!-- Trip -->
          <div></div>
          <!-- Ticket -->
          <div></div>
          <!-- Live -->
          <div></div>
        </div>
      </main>
      <!-- bottom -->
      <footer>
        <div></div>
      </footer>
    </div>
  </body>
</html>
