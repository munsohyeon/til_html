<!DOCTYPE html>
<!-- ! 하고 탭 -->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입</title>
  </head>
  <body>
    <!-- 회원가입 창 작성칸 -->
    <div class="join_form">
      <h2>회원가입</h2>
      <form action="member_join.jsp" method="get">
        <!-- 기본정보 -->
        <fieldset>
          <legend>기본정보</legend>
          <label>아이디</label>
          <input
            type="text"
            id="userid"
            name="userid"
            minlength="8"
            maxlength="16"
            required
          />
          <button>아이디 중복확인</button>
          <br />

          <label for="">비밀번호</label>

          <input
            id="pass"
            name="pass"
            type="text"
            id="userid"
            minlength="8"
            maxlength="16"
            required
          />
          <br />
          <label for="pass2">비밀번호 확인</label>
          <input
            id="pass2"
            type="password"
            minlength="8"
            maxlength="16"
            required
          />
          <br />

          <label>이름</label>
          <input type="text" name="name" readonly />
          <br />

          <label>이메일</label>
          <input type="email" name="name" readonly />
          <br />

          <label>성별</label>
          <input type="radio" name="gender" value="1" checked />남성
          <input type="radio" name="gender" value="female" />여성
          <br />

          <label>생년월일</label>
          <input type="date" name="birthday" />
          <br />

          <label>이용약관</label>
          <textarea readonly>이용약관이예요.</textarea>

          <label>이용약관동의</label>
          <input type="checkbox" name="agree" />
        </fieldset>

        <!-- 부가정보 -->
        <fieldset>
          <legend>부가정보</legend>
          <label>지역</label>
          <select name="city">
            <option>대구</option>
            <option value="dg">서울</option>
            <option value="se">부산</option>
          </select>

          <br />
          <label>파일(5Mega이하만됩니다.)</label>
          <input type="file" name="file" />
        </fieldset>

        <!-- 버튼 -->
        <fieldset>
          <input type="reset" value="재작성" />
          <input type="submit" value="회원가입" />
        </fieldset>
      </form>
    </div>
  </body>
</html>
